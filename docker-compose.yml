services:
  # FastAPI 백엔드 (정적 파일 서빙 포함)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investigation-api
    ports:
      - "8106:8000"
    env_file:
      - .env
    environment:
      # 데이터베이스 연결: DATABASE_URL은 .env에서 주입

      # 애플리케이션 설정
      - ENVIRONMENT=production

    volumes:
      # 설정 파일 마운트
      - ./config:/app/config:ro
      # SQLite 사용 시 DB 영속화: DATABASE_URL=sqlite:////app/data/app.db
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # 리소스 제한
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
