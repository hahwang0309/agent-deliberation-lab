<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent Persona Discussion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">🤖 Multi-Agent Discussion</h1>
            <p class="text-gray-600">AI 페르소나들이 실시간으로 토론하는 과정을 확인하세요</p>
        </div>

        <!-- Control Panel -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center gap-4 mb-4">
                <input
                    type="text"
                    id="topicInput"
                    placeholder="토론 주제를 입력하세요 (예: 인공지능의 윤리적 문제)"
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value="인공지능의 윤리적 문제"
                />
                <button
                    id="startBtn"
                    class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed font-medium"
                >
                    토론 시작
                </button>
                <button
                    id="stopBtn"
                    class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed font-medium hidden"
                >
                    중지
                </button>
            </div>

            <!-- Settings -->
            <div class="flex items-center gap-4">
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <span>라운드 수:</span>
                    <input
                        type="number"
                        id="roundsInput"
                        min="3"
                        max="20"
                        value="5"
                        class="w-20 px-3 py-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </label>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" id="enableRAG" class="rounded">
                    <span>웹 검색 (RAG)</span>
                </label>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" id="enableModerator" checked class="rounded">
                    <span>모더레이터</span>
                </label>
            </div>

            <!-- Status -->
            <div id="status" class="mt-4 text-sm text-gray-600"></div>
        </div>

        <!-- Messages Container -->
        <div id="messagesContainer" class="space-y-4">
            <!-- Messages will be inserted here -->
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';
        let eventSource = null;
        let currentDiscussionId = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const topicInput = document.getElementById('topicInput');
        const statusDiv = document.getElementById('status');
        const messagesContainer = document.getElementById('messagesContainer');

        // 페르소나별 색상 매핑
        const personaColors = {
            '낙관주의자': 'bg-green-100 border-green-400 text-green-800',
            '비관주의자': 'bg-red-100 border-red-400 text-red-800',
            '중립주의자': 'bg-blue-100 border-blue-400 text-blue-800',
            '실용주의자': 'bg-yellow-100 border-yellow-400 text-yellow-800',
            '이상주의자': 'bg-purple-100 border-purple-400 text-purple-800',
            'Moderator': 'bg-orange-100 border-orange-500 text-orange-900',
            'MODERATOR': 'bg-orange-100 border-orange-500 text-orange-900',
            'default': 'bg-gray-100 border-gray-400 text-gray-800'
        };

        // 토론 시작 (게스트 모드 - 생성부터 스트리밍까지 한 번에)
        startBtn.addEventListener('click', async () => {
            const topic = topicInput.value.trim();
            if (!topic) {
                alert('토론 주제를 입력해주세요.');
                return;
            }

            // 설정 값 가져오기
            const rounds = parseInt(document.getElementById('roundsInput').value) || 5;
            const enableRAG = document.getElementById('enableRAG').checked;
            const enableModerator = document.getElementById('enableModerator').checked;

            try {
                startBtn.disabled = true;
                topicInput.disabled = true;
                updateStatus('토론 생성 및 시작 중...', 'text-blue-600');
                messagesContainer.innerHTML = '';

                // 게스트 토론 생성 + 즉시 스트리밍 (GPT 스타일)
                const url = `${API_BASE_URL}/discussions/guest/start`;

                // POST 요청으로 토론 생성 + SSE 스트리밍
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        topic: topic,
                        description: "게스트 모드 토론",
                        participants: [
                            {
                                template_id: "optimist",
                                llm_provider: "openai",
                                model: "gpt-4o-mini"
                            },
                            {
                                template_id: "pessimist",
                                llm_provider: "openai",
                                model: "gpt-4o-mini"
                            },
                            {
                                template_id: "neutral",
                                llm_provider: "openai",
                                model: "gpt-4o-mini"
                            }
                        ],
                        config: {
                            max_rounds: rounds,
                            min_rounds: Math.max(3, Math.floor(rounds * 0.7)),
                            enable_rag: enableRAG,
                            enable_subtopics: true,
                            enable_reflection: false,
                            enable_moderation: enableModerator
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`토론 시작 실패: ${response.statusText}`);
                }

                // SSE 스트리밍 수신 (response.body를 사용)
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                stopBtn.classList.remove('hidden');
                startBtn.classList.add('hidden');

                let buffer = '';
                let currentEvent = null;

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        updateStatus('토론이 완료되었습니다.', 'text-green-600');
                        resetUI();
                        break;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // 마지막 불완전한 줄은 버퍼에 보관

                    for (const line of lines) {
                        if (line.startsWith('event:')) {
                            currentEvent = line.substring(6).trim();
                        } else if (line.startsWith('data:')) {
                            try {
                                const data = JSON.parse(line.substring(5).trim());
                                console.log('SSE Event:', currentEvent, data); // 디버깅
                                handleStreamData(currentEvent, data);
                            } catch (e) {
                                console.error('Failed to parse SSE data:', e, line);
                            }
                        }
                    }
                }

            } catch (error) {
                console.error('Error:', error);
                updateStatus(`오류 발생: ${error.message}`, 'text-red-600');
                resetUI();
            }
        });

        // 토론 중지
        stopBtn.addEventListener('click', () => {
            updateStatus('토론이 중지되었습니다.', 'text-gray-600');
            resetUI();
            location.reload(); // 페이지 새로고침으로 스트림 중단
        });

        // 스트림 데이터 처리
        function handleStreamData(eventType, data) {
            console.log('Handling event:', eventType, data);

            switch (eventType) {
                case 'discussion_started':
                    currentDiscussionId = data.discussion_id;
                    updateStatus(`✅ 토론이 시작되었습니다 (ID: ${data.discussion_id})`, 'text-green-600');
                    break;

                case 'round_start':
                    updateStatus(`📍 Round ${data.round_number} 시작: ${data.current_subtopic || '토론 진행중'}`, 'text-blue-600');
                    break;

                case 'message':
                    // speaker 필드 사용
                    addMessage({
                        speaker: data.speaker,
                        content: data.content,
                        round: data.round
                    });
                    break;

                case 'message_chunk':
                    // 실시간 스트리밍 청크
                    addOrUpdateMessage({
                        temp_id: data.temp_id,
                        speaker: data.speaker,
                        content: data.accumulated_text,  // 누적된 텍스트 사용
                        round: data.round || 1
                    });
                    break;

                case 'moderator_message':
                    // 모더레이터 메시지
                    addModeratorMessage({
                        speaker: 'Moderator',
                        content: data.content,
                        type: data.type
                    });
                    updateStatus(`📢 Moderator: ${data.type}`, 'text-orange-600');
                    break;

                case 'discussion_completed':
                    updateStatus(`🎉 토론 완료! 총 ${data.total_rounds}라운드, ${data.total_messages}개 메시지`, 'text-green-600');
                    setTimeout(() => resetUI(), 2000);
                    break;

                case 'error':
                    updateStatus(`❌ 오류: ${data.message}`, 'text-red-600');
                    resetUI();
                    break;

                default:
                    console.log('Unknown event type:', eventType);
            }
        }

        // 메시지 추가 (완성된 메시지)
        function addMessage(data) {
            const messageId = `msg-${data.round}-${data.speaker}`;

            // 이미 존재하면 업데이트만
            let messageDiv = document.getElementById(messageId);
            if (messageDiv) {
                const contentElement = messageDiv.querySelector('.message-content');
                if (contentElement) {
                    contentElement.textContent = data.content;
                }
                return;
            }

            // 새 메시지 생성
            messageDiv = document.createElement('div');
            messageDiv.id = messageId;
            const colorClass = personaColors[data.speaker] || personaColors['default'];
            messageDiv.className = `${colorClass} border-l-4 rounded-lg p-4 shadow-sm animate-fade-in`;

            messageDiv.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <span class="font-bold text-lg">${data.speaker}</span>
                    <span class="text-xs opacity-75">Round ${data.round}</span>
                </div>
                <p class="text-sm whitespace-pre-wrap message-content">${data.content}</p>
                <div class="text-xs opacity-75 mt-2">${new Date().toLocaleTimeString('ko-KR')}</div>
            `;

            messagesContainer.appendChild(messageDiv);
            messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 모더레이터 메시지 추가
        function addModeratorMessage(data) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'bg-orange-100 border-l-4 border-orange-500 text-orange-900 rounded-lg p-4 shadow-md animate-fade-in';

            const typeLabel = {
                'transition': '주제 전환',
                'probing': '구체화 요청',
                'question': '심화 질문'
            }[data.type] || '개입';

            messageDiv.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <span class="font-bold text-lg">📢 MODERATOR</span>
                    <span class="text-xs opacity-75">${typeLabel}</span>
                </div>
                <p class="text-sm whitespace-pre-wrap font-medium">${data.content}</p>
                <div class="text-xs opacity-75 mt-2">${new Date().toLocaleTimeString('ko-KR')}</div>
            `;

            messagesContainer.appendChild(messageDiv);
            messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 메시지 추가 또는 업데이트 (스트리밍 청크)
        function addOrUpdateMessage(data) {
            // temp_id를 사용하거나 speaker를 키로 사용
            const messageId = data.temp_id || `msg-${data.speaker}`;
            let messageDiv = document.getElementById(messageId);

            if (!messageDiv) {
                // 새 메시지 생성
                messageDiv = document.createElement('div');
                messageDiv.id = messageId;

                // speaker 이름으로 색상 찾기 (없으면 default)
                const colorClass = personaColors[data.speaker] || personaColors['default'];
                messageDiv.className = `${colorClass} border-l-4 rounded-lg p-4 shadow-sm animate-fade-in`;

                messageDiv.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-bold text-lg">${data.speaker}</span>
                        <span class="text-xs opacity-75">실시간 스트리밍 중...</span>
                    </div>
                    <p class="text-sm whitespace-pre-wrap message-content"></p>
                    <div class="text-xs opacity-75 mt-2">${new Date().toLocaleTimeString('ko-KR')}</div>
                `;

                messagesContainer.appendChild(messageDiv);
            }

            // 메시지 내용 업데이트 (누적된 텍스트로)
            const contentElement = messageDiv.querySelector('.message-content');
            if (contentElement && data.content) {
                contentElement.textContent = data.content;
                // 자동 스크롤
                messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }


        // 상태 업데이트
        function updateStatus(message, className = 'text-gray-600') {
            statusDiv.textContent = message;
            statusDiv.className = `mt-4 text-sm ${className}`;
        }

        // UI 리셋
        function resetUI() {
            startBtn.disabled = false;
            topicInput.disabled = false;
            stopBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
        }

        // 애니메이션 CSS 추가
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fade-in {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .animate-fade-in {
                animation: fade-in 0.3s ease-out;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
