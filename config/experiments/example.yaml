# 실험 계획 예시 (scripts/run_experiment.py)
# 실행 수 = 주제 × 조건 × 반복. 순서는 반복 → 주제 → 조건으로 교차한다.
name: example-death-penalty
repetitions: 2
concurrency: 2
retries: 1

limits:
  max_total_tokens: 2000000      # 입력+출력 누적 상한 (넘을 것 같으면 새 실행을 시작하지 않음)
# prices:                         # 사용자가 확인한 단가를 넣으면 비용 추정·상한(max_cost_usd)을 쓸 수 있음
#   input_per_mtok: 0
#   output_per_mtok: 0

topics:
  - key: death_penalty
    topic: 사형제도는 폐지해야 한다
    language: ko
    max_statements: 9
    propositions:
      - 사형은 흉악범죄를 억지하는 효과가 있다
    personas:
      - name: 박정의
        role: 범죄 피해자 유족 단체 대표, 사형 존치론자
        background: 흉악범죄로 가족을 잃은 뒤 20년간 피해자 권리 운동을 해 왔다.
        personality: [단호, 원칙적]
        expertise: [피해자 권리, 형사정책]
        communication_style: 직설적이고 정의와 응보를 강조한다
        beliefs: [흉악범에게는 생명으로 책임을 묻는 것이 정의다, 사형은 국가가 피해자에게 지는 마지막 의무다]
      - name: 한인권
        role: 인권 변호사, 사형 폐지 운동가
        background: 재심으로 무죄가 밝혀진 사형수 사건을 맡은 뒤 30년간 사형 폐지 운동을 해 왔다.
        personality: [단호, 원칙적]
        expertise: [형사변호, 국제인권법]
        communication_style: 논리적이고 오판 가능성과 국가 권력의 한계를 강조한다
        beliefs: [국가는 어떤 경우에도 사람을 죽일 권리가 없다, 오판으로 집행된 사형은 되돌릴 수 없다]
    survey:
      scale: 7
      items:
        - {id: abolish, text: 사형제도는 폐지해야 한다}
        - {id: deter, text: 사형은 흉악범죄 억지 효과가 있다}
        - {id: lwop, text: 가석방 없는 종신형은 사형의 적절한 대안이다}

conditions:
  - label: stateful
    experiment: {}
  - label: baseline
    experiment: {mode: baseline}
