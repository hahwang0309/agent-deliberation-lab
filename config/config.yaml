# Agent Deliberation Lab 설정 - 모델명과 동작 파라미터는 이 파일에만 둔다
# (비밀값은 .env, 프롬프트는 config/*prompts.yaml, 사례 문구는 config/cases.yaml)
# 코드에는 기본값을 두지 않으므로 항목이 빠지면 시작할 때 오류가 난다.

# ---------- LLM ----------
llm:
  # 참가자·페르소나 생성에서 provider를 지정하지 않으면 사용
  default_provider: "claude"

  # 프로바이더별 기본 모델 (모델을 지정하지 않은 모든 호출: 참가자, 모더레이터, 분석, 보고서, 페르소나 생성, RAG)
  # 모델 간 비교가 가능하도록 같은 등급(각 회사의 가장 작은 범용 모델)으로 맞춘다. 바꿀 때도 4개를 같은 등급으로 고른다.
  # 가능하면 날짜가 박힌 고정 ID를 쓴다 (별칭 *-latest는 가리키는 모델이 바뀌어 재현이 어려움).
  default_models:
    claude: "claude-haiku-4-5-20251001"   # Claude Haiku 4.5 (2025-10)
    gemini: "gemini-3.5-flash-lite"       # Gemini 3.5 Flash-Lite (2026-07, Google은 날짜 없는 ID만 제공)
    mistral: "mistral-small-2603"         # Mistral Small (2026-03)
    openai: "gpt-6-luna"                  # GPT-6 Luna (2026-10 기준 OpenAI 최소 범용 모델, 날짜 고정 ID 없음; 미실측)

  # temperature를 받지 않거나 무시하는 모델 (이름 접두어, 모든 프로바이더).
  # 이 모델은 temperature 없이 호출하고 실행 기록에는 null(모델 기본값)로 남긴다.
  # gemini-3.5-flash-lite: 라이브러리가 "fixed sampling defaults; temperature will be ignored" 경고 (2026-10 확인)
  fixed_sampling_prefixes: ["claude-fable-5", "claude-sonnet-5-5", "gemini-3.5-flash-lite"]
  # 구조화 출력을 강제 도구 호출 대신 json_schema 방식으로 해야 하는 모델 (적응형 사고가 기본인 Claude)
  json_schema_prefixes: ["claude-fable-5", "claude-sonnet-5-5"]

  # temperature를 지정하지 않은 호출의 기본값
  temperature: 0.7
  # 보조 작업별 temperature (토론 참가자·모더레이터·분석은 engine, 보고서는 report)
  task_temperatures:
    persona_generation: 0.8
    rag_query: 0.3          # 검색 질의 생성
    rag_router: 0.1         # 질의 유형 분류
    rag_synthesis: 0.3      # 검색 결과 종합
    belief_reasoning: 0.3

  max_tokens: 1500             # 응답 상한 (실제 길이는 프롬프트의 문장 수 지시가 결정; 한국어는 토큰이 많아 500이면 잘림)
  structured_max_tokens: 2000  # 구조화 출력(페르소나 생성 등) 전용 — JSON이 잘리지 않도록 여유 있게

  # 호출 안정성 (LLMFactory가 모든 프로바이더에 적용)
  timeout_seconds: 60
  max_retries: 2

# 페르소나 자동 생성 (src/generators/persona_generator.py)
persona_generation:
  max_attempts: 2   # 구조화 출력 검증 실패 시 재시도 포함 총 시도 횟수

# ---------- 토론 엔진 (토론별로 실험 조건이 덮어씀, src/core/experiment.py) ----------
engine:
  # 발언 길이 (프롬프트의 문장 수 지시)
  min_response_sentences: 3
  max_response_sentences: 8

  enable_web_search: true   # 웹 검색(RAG) 기본 활성화 (토론별 플래그가 우선)

  # 진행 설계: 명제 수 k = clamp(본론 발언 수 // (참가자 수 + 1), 1, max_subtopics)
  #            본론 발언 수 = 전체 − 종결 라운드(참가자 수, 본론이 참가자 수+1 이상 남을 때만)
  max_subtopics: 5
  # 상대 발언 전달 범위 (최근 N개, 발언당 최대 글자 수)
  context_messages: 8
  context_chars: 1200

  # 토론 상태 기반 진행
  stalemate_exchanges: 1        # 두 참가자가 서로 이만큼 반박을 주고받으면 교착 → 제3자 중재·제3안 (명제당 예산이 작아 1)
  consensus_spread: 0.3         # 첫 입장들의 차이가 이보다 작으면 성급한 합의 → 반대 검토
  close_stance_distance: 0.4    # 입장 거리가 이보다 가까우면 동의·확장/예시, 아니면 반박/근거 공격
  stance_strong: 0.6            # 입장 라벨(−1~1): |x| ≥ 0.6 '강한' 찬성·반대
  stance_lean: 0.2              # |x| ≥ 0.2 찬성·반대, 그 안쪽은 유보
  stance_note_min_shift: 0.05   # 발언자에게 "입장이 움직였다"고 알리는 최소 이동
  commitments_kept: 6           # 참가자별로 기억하는 최근 주장 수

  # 발언 분석 (UtteranceAnalysis)
  analyzer_temperature: 0.0
  analysis_context_messages: 6  # 함께 넣는 직전 발언 수
  analysis_context_chars: 600   # 그 발언들의 발언당 글자 수 상한

  # 입장 동역학 (Friedkin-Johnsen + 제한 신뢰, src/core/debate_state.py)
  dynamics_step: 0.5            # 설득 1회의 최대 이동 비율
  dynamics_anchor: 0.1          # 초기 입장으로 돌아가려는 힘 (고집도와 곱해짐)
  # 수용·거부 범위 (Sherif & Hovland): 수용 범위 폭 = accept_wide − (accept_wide − accept_narrow) × 고집도
  accept_wide: 1.2
  accept_narrow: 0.4
  noncommit_width: 0.4          # 수용 범위 바깥 비관여 범위 폭 (그 너머는 거부 범위)
  noncommit_factor: 0.5         # 비관여 범위 설득력 배수
  reject_factor: 0.15           # 거부 범위 설득력 배수
  threat_dampen: 0.5            # 정체성 위협이 설득력을 줄이는 정도
  boomerang_threshold: 0.5      # 거부 범위에서 위협이 이 이상이면 반대로 멀어짐
  boomerang_step: 0.1
  # 양보에 따른 일관성 이동 (양보 1건당 × (1 − 고집도), 명제당 상한)
  concession_step: 0.05
  concession_cap: 0.2
  # 설득력 q = 질 × 새로움 × (1−a + a×가치 일치) × (1−b + b×신뢰) × (1−c + c×수용성)
  value_match_weight: 0.5       # a
  credibility_weight: 0.5       # b
  receptive_weight: 0.3         # c
  # 모래성 문턱 모델 (Redlawsk et al. 2010 감정적 티핑 포인트, van der Maas et al. 2003 파국 모델,
  # Friedkin et al. 2016, Chinn & Brewer 1993): 주변 근거가 무너진 비율(방어 압력 D)이 문턱을 넘으면 핵심 입장이 급변.
  # 수치는 실증값이 아닌 설정값이며 개발 세트에서만 보정한다
  grounds_max: 4                # 참가자·명제별로 기록하는 지지 근거 수
  undermine_self: 0.6           # 자기 근거와 충돌하는 주장을 스스로 인정할 때 약화 (× 심각도)
  undermine_other: 0.3          # 다른 참가자의 반박으로 약화 (× 심각도, 심각도에 논증의 질이 반영됨)
  undermine_unanswered: 0.25    # 명제가 끝날 때까지 답하지 않은 반박이 있으면 가장 강한 근거 약화
  switch_theta_min: 0.3         # 문턱 θ = min + (max − min) × 고집도
  switch_theta_max: 0.7
  low_involvement: 0.4          # 고집도가 이보다 낮으면 문턱 없이 D에 비례해 연속 이동
  continuous_gain: 0.5          # 저관여 연속 이동: D 증가분 × gain만큼 상대 쪽으로
  bolster_step: 0.05            # 고관여 문턱 전: D 증가분 × step만큼 자기 쪽으로 보강
  switch_base: 0.5              # 전환 폭 = (상대 쪽까지 거리) × min(1, base + gain × 고집도)
  switch_gain: 0.4
  use_threshold_switch: true    # 모래성 문턱 모델 on/off (실험 조건 mechanisms.threshold_switch)
  # 고집도 (성격 키워드로 정함, 실험 조건으로 참가자별 지정 가능)
  stubbornness_default: 0.5
  stubbornness_open: 0.3        # 성격에 개방적·유연 등이 있으면
  stubbornness_firm: 0.75       # 성격에 완고·원칙적 등이 있으면

  # stateful(상태 기반 진행) | baseline(순서대로 앞 발언에 답하는 단순 토론) | survey_only(토론 없음)
  engine_mode: "stateful"
  record_prompts: false         # 발언마다 최종 지시 프롬프트를 meta에 저장 (실험 조건이 있으면 기본 켬)

  # 진행 장치 on/off (실험 조건으로 끌 수 있음)
  use_reply_obligation: true
  use_stalemate_mediation: true
  use_devils_advocate: true
  use_closing_round: true

  agent_temperature: 0.7
  moderator_temperature: 0.5

  # 사람 개입: 사람 발언 직후 그 발언에 응답하는 AI 발언 수 (명제 예산을 쓰고, 예산이 끝났으면 추가 발언)
  human_followup_responses: 1

# 사전·사후 설문 (src/services/survey.py)
survey:
  transcript_chars: 15000   # 사후 설문에 넣는 토론 기록 길이 (끝에서부터)
  max_attempts: 2           # 형식 오류 시 다시 묻기 포함 총 시도 횟수

# 분석용 추출 지표 (src/services/experiment_export.py, debate_dynamics.py)
analysis:
  repeat_threshold: 0.4     # 논거 반복 지표: 이 이상이면 반복 발언으로 셈 (discussions.repeat_rate)
  min_shift: 0.05           # 입장 궤적에서 이보다 작은 이동은 '변화 없음'

# 배치 실행기 사전 추정 (api/services/experiment_runner.py)
# 실측(Haiku 4.5, 2명·9발언·분석·설문·보고서 포함, 6회)의 발언 1개당 토큰
experiment_runner:
  rough_input_per_statement: 10700
  rough_output_per_statement: 1530

# ---------- 서버 ----------
# 실행 제한 (API 토론 런타임)
limits:
  max_global_running: 5     # 서버 전체 동시 실행 토론 수
  default_statements: 12    # 토론 생성 시 기본 AI 발언 수
  max_statements: 60        # AI 발언 수 상한 (A1R 실제 소집단 복제: 16명 × 3)
  min_personas: 2
  max_personas: 16          # A1R 실제 소집단(8~16명) 복제용. 참가자가 많을수록 발언·설문 호출이 늘어남
  user_max_concurrent: 1    # 일반 사용자 동시 실행 토론 수 (관리자 무제한, 사용자별 override 가능)
  user_daily_starts: 5      # 일반 사용자 하루(UTC) 토론 시작 수
  user_expensive_features: false  # 일반 사용자에게 웹검색·신념추론 허용 여부 (LLM 호출 급증)
  max_human_turns_per_user: 5   # 토론 1건에서 한 사람이 발언할 수 있는 횟수
  max_human_chars: 1000         # 사람 발언 최대 글자 수

# 종합보고서 (src/services/consensus_report.py)
report:
  model: null                # null이면 llm.default_provider의 기본 모델
  temperature: 0.0
  max_tokens: 4000           # 쟁점 추출·요약 구조화 출력 상한
  max_attempts: 3            # 구조화 출력 검증 실패 시 총 시도 횟수
  min_ai_messages: 4         # 이 수 이상 AI 발언이 있어야 보고서 생성 (중지된 토론 포함)
  partial_weight: 0.7        # 부분 찬성이 지지 쪽에 기여하는 비율 (반대 쪽에는 기여하지 않음)
  thresholds:                # 쟁점별 수렴도 → 라벨
    agreed: 0.8              # 이상이면 '합의'
    partial: 0.6             # 이상이면 '부분 합의', 미만은 '이견'
