# Multi-Agent Persona Discussion System Configuration

# LLM 설정
llm:
  # 기본 프로바이더 (참가자·페르소나 생성에서 provider를 지정하지 않으면 사용)
  default_provider: "claude"

  # 기본 모델 설정
  default_models:
    openai: "gpt-4"
    gemini: "gemini-pro"
    claude: "claude-haiku-4-5-20251001"
    mistral: "mistral-large-latest"
  
  # 공통 파라미터
  temperature: 0.7
  max_tokens: 1500  # 응답 상한 (실제 길이는 프롬프트의 3-8문장 지시가 결정; 한국어는 토큰이 많아 500이면 잘림)
  structured_max_tokens: 2000  # 구조화 출력(페르소나 생성 등) 전용 — JSON이 잘리지 않도록 여유 있게

  # 호출 안정성 (LLMFactory가 모든 프로바이더에 적용)
  timeout_seconds: 60  # 요청당 타임아웃
  max_retries: 2       # 실패 시 재시도 횟수
  
  # 빠른 데모용 설정
  quick_demo:
    model: "gpt-3.5-turbo"
    temperature: 0.7
    max_tokens: 400

# 토론 설정
discussion:
  # 발언 길이 제한
  response_length:
    min_sentences: 3
    max_sentences: 8
    display_limit: 0  # 0이면 전체 표시, 양수면 해당 글자수까지만 표시
  
  # 토론 구조
  default_rounds: 2
  max_context_messages: 5  # 컨텍스트로 전달할 이전 메시지 수
  
  # 페르소나 생성
  persona:
    default_count: 3
    max_count: 5
    perspectives:
      - strongly_advocate  # 강력한 지지자
      - skeptical_critic   # 회의적 비판자
      - contrarian        # 반대론자
      - pragmatic_realist # 실용적 현실주의자
      - radical_challenger # 급진적 도전자
    # 언어 스타일 다양성
    communication_styles:
      - "analytical_precise"  # 분석적이고 정확한
      - "empathetic_storyteller"  # 공감적이고 스토리텔링
      - "pragmatic_direct"  # 실용적이고 직설적
      - "philosophical_questioning"  # 철학적이고 질문형
      - "data_driven_empirical"  # 데이터 중심적

# 실행 제한 (API 토론 런타임)
limits:
  max_global_running: 5     # 서버 전체 동시 실행 토론 수
  default_statements: 12    # 토론 생성 시 기본 AI 발언 수
  max_statements: 30        # AI 발언 수 상한
  min_personas: 2
  max_personas: 5

# 종합보고서 (src/services/consensus_report.py)
report:
  model: null                # null이면 llm.default_provider의 기본 모델
  max_tokens: 4000           # 쟁점 추출·요약 구조화 출력 상한
  max_attempts: 3            # 구조화 출력 검증 실패 시 총 시도 횟수
  min_ai_messages: 4         # 이 수 이상 AI 발언이 있어야 보고서 생성 (중지된 토론 포함)
  partial_weight: 0.7        # 부분 찬성이 지지 쪽에 기여하는 비율 (반대 쪽에는 기여하지 않음)
  thresholds:                # 쟁점별 수렴도 → 라벨
    agreed: 0.8              # 이상이면 '합의'
    partial: 0.6             # 이상이면 '부분 합의', 미만은 '이견'

# 고급 토론 설정
advanced_discussion:
  # 에이전트 역할
  agent_roles:
    - moderator
    - expert
    - critic
    - synthesizer
    - questioner
  
  # 토론 단계
  phases:
    - opening
    - exploration
    - debate
    - synthesis
    - conclusion
  
  # 단계별 설정
  phase_settings:
    exploration:
      min_speakers: 2
      max_speakers: 5
    debate:
      enable_critics: true
      counter_arguments: true
    synthesis:
      summarize_key_points: true
      consensus_check: true

# UI 설정
ui:
  # Rich 콘솔 설정
  console:
    use_emoji: true
    panel_width: 80
  
  # 색상 테마
  colors:
    agent_a: "cyan"
    agent_b: "magenta"
    agent_c: "green"
    moderator: "yellow"
    system: "blue"
    error: "red"
  
  # 토론 출력 설정
  output:
    show_thinking: true  # "생각 중..." 메시지 표시
    show_round_info: true
    show_statistics: true

# 시스템 설정
system:
  # 로깅
  logging:
    enabled: false
    level: "INFO"
    file: "discussion.log"
  
  # 성능 (LLM 타임아웃/재시도는 llm.timeout_seconds, llm.max_retries)
  performance:
    cache_responses: false