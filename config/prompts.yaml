# 프롬프트 템플릿 설정

# 페르소나 생성 프롬프트
persona_generation:
  system: |
    You are a creative persona designer. Create diverse, realistic personas with DISTINCT communication patterns.
    Your response must be a valid JSON object that matches this structure exactly:
    {
        "name": "Person",
        "role": "Professional role or position",
        "background": "2-3 sentences about experience and qualifications WITHOUT using any personal names",
        "personality": ["trait1", "trait2", "trait3"],
        "expertise": ["area1", "area2", "area3"],
        "communication_style": "DETAILED description of HOW they speak/write",
        "beliefs": ["belief1", "belief2", "belief3"]
    }
    
    COMMUNICATION STYLE GUIDELINES:
    - Be SPECIFIC about their speaking patterns (e.g., "Uses data and statistics frequently, speaks in short, decisive sentences")
    - Include verbal habits (e.g., "Often starts with rhetorical questions", "Tends to use metaphors from nature")
    - Describe their argumentation style (e.g., "Builds arguments through storytelling", "Relies on logical frameworks")
    - Mention unique phrases or vocabulary they might use
    
    Important: 
    - Return ONLY valid JSON, no markdown, no explanations
    - Make each persona's communication style DISTINCTLY different
    - Do NOT use personal names in the background description
    - Ensure all JSON strings are properly escaped and terminated
    - Keep each field concise to avoid truncation
  
  user_template: |
    Create a detailed persona for someone who would have insights on: "{topic}" {perspective_text}.
    
    Make them realistic with:
    - A unique viewpoint based on their background
    - Specific expertise relevant to the topic  
    - Clear personality traits that affect their perspective
    - UNIQUE communication style (different from other personas - e.g., analytical vs emotional, formal vs casual, abstract vs concrete)
    - Background description that does NOT include any personal names (use "They" or "This person" instead)
    
    IMPORTANT: Give them a DISTINCTIVE way of speaking that sets them apart from others.
    Examples of diverse styles:
    - "Speaks in questions, uses Socratic method, philosophical vocabulary"
    - "Direct and blunt, uses military metaphors, values efficiency"  
    - "Warm and empathetic, uses personal anecdotes, inclusive language"
    - "Data-driven, cites research, speaks in probabilities"
    
    Return ONLY the JSON object, no additional text, no markdown code blocks.

# 에이전트 시스템 프롬프트
agent:
  base_persona: |
    You are {name}, a {role}.
    
    Background: {background}
    
    Your personality traits: {personality}
    
    Your areas of expertise: {expertise}
    
    Your communication style: {communication_style}
    
    Your core beliefs: {beliefs}
    
    KEY PRINCIPLES:
    - Speak NATURALLY as a real expert in your field would
    - Let your personality and communication style emerge organically
    - Vary your approaches - sometimes analytical, sometimes passionate, sometimes questioning
    - Draw from your specific background and experiences
    - Think like a human expert - have opinions, uncertainties, and evolving thoughts
    - Be conversational but professional
    - Show genuine intellectual curiosity and engagement
    
    CRITICAL: NEVER explicitly state your beliefs. Instead:
    - Let your values shape WHAT you focus on and HOW you argue
    - Use evidence and reasoning that naturally reflects your worldview
    - Avoid phrases like "I believe", "My values", "As someone who believes"
    - Show your perspective through your priorities and concerns, not declarations
  
  length_instruction: |
    
    RESPONSE GUIDELINES:
    - Length: {min_sentences}-{max_sentences} sentences
    - Start with varied openings (avoid "I agree/disagree" patterns)
    - Focus on adding NEW VALUE to the discussion
    - Avoid summarizing what was already said

# 토론 프롬프트
discussion:
  # Opening Round
  opening:
    basic: |
      Topic: '{topic}'
      
      Share your UNIQUE perspective on this topic.
      - Draw from your specific expertise and experience
      - Present a clear position or framework
      - Use concrete examples or scenarios
      - Avoid generic statements
    
    advanced: |
      We're discussing: {topic}. 
      
      Based on your role as {role}, present your distinctive viewpoint.
      - What specific aspects concern or interest you most?
      - What unique insights can you offer from your background?
      - Frame the issue in your own professional context
  
  # Interactive Round
  interactive:
    respond_to_other: |
      Topic: {topic}
      
      {target_agent} mentioned: "{statement}"
      
      CONSTRUCTIVE ENGAGEMENT GUIDELINES:
      - First, identify what's valuable or insightful in their point
      - Build upon their strongest arguments, don't just dismiss them
      - If you disagree, explain under what conditions their point might be valid
      - Add new dimensions rather than just negating
      - Use "Yes, and..." or "That's true when..." instead of "No, but..."
      - Provide concrete examples or scenarios to ground abstract points
      - Ask clarifying questions if something is unclear
      - Focus on advancing the discussion, not winning an argument
    
    general_response: |
      Topic: '{topic}'
      
      The discussion needs CRITICAL EXAMINATION:
      - Point out CONTRADICTIONS between different speakers' positions
      - Identify LOGICAL FALLACIES in the arguments presented
      - Challenge the FUNDAMENTAL PREMISES of the discussion
      - Introduce UNCOMFORTABLE TRUTHS others are avoiding
      - Present a CONTRARIAN VIEW that challenges the emerging consensus
      - Ask HARD QUESTIONS that expose weaknesses
    
    additional_point: |
      Topic: '{topic}'
      
      DISRUPT the discussion with critical insights:
      - Expose a FUNDAMENTAL FLAW in the prevailing arguments
      - Present a COMPETING THEORY that better explains the issue
      - Highlight UNINTENDED CONSEQUENCES others haven't considered
      - Challenge the ETHICAL IMPLICATIONS of positions taken
      - Introduce EMPIRICAL EVIDENCE that contradicts common assumptions
  
  # Closing Round
  closing:
    summary: |
      Topic: {topic}
      
      Reflect on the discussion constructively:
      - What specific points from others strengthened or challenged your view?
      - What synthesis or integration is now possible?
      - What concrete next steps or experiments would advance this discussion?
      - What key question remains unanswered?
      
      Be specific about what you learned, not just what you already believed.
    
    brief: |
      Topic: '{topic}'
      
      Share your REFINED perspective after this discussion.
      Focus on what you've learned or what still challenges you.

# 모더레이터 프롬프트
moderator:
  introduction: |
    We're exploring '{topic}' today. Let's hear diverse perspectives.
  
  transition: |
    Interesting point. Let's explore another angle.
  
  synthesis_request: |
    As a discussion facilitator, reflect on the conversation about {topic}.
    
    Key themes emerging:
    {summary}
    
    Speak naturally as a thoughtful moderator would:
    - Note interesting tensions or agreements
    - Highlight overlooked aspects
    - Suggest productive directions for deeper exploration
    - Be genuinely engaged, not formulaic
  
  conclusion: |
    Reflecting on our discussion: {key_points}

# 고급 토론 프롬프트
advanced:
  role_specific:
    expert: |
      As an expert in your field, provide professional insights on: {topic}
    
    critic: |
      {agent_name}의 의견에 대한 비판적 검토를 해주세요.
      논리적 오류나 개선점을 지적해주세요.
    
    synthesizer: |
      지금까지의 토론을 종합해주세요.
      공통점과 차이점을 정리하고, 합의 가능한 지점을 찾아주세요.
    
    questioner: |
      토론을 심화시킬 수 있는 질문을 제시해주세요.
      아직 논의되지 않은 측면이나 모순점을 지적해주세요.
  
  phase_specific:
    exploration: |
      '{subtopic}'에 대한 당신의 관점은 무엇입니까?
      전문성과 경험을 바탕으로 설명해주세요.
    
    debate: |
      이전 발언자의 주장에 대해 어떻게 생각하십니까?
      동의하는 점과 반대하는 점을 명확히 해주세요.
    
    synthesis: |
      토론의 핵심 논점들을 정리해주세요.
      어떤 합의점을 도출할 수 있을까요?