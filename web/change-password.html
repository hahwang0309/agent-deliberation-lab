<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 변경 · 페르소나 토론</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <section class="card auth-box">
    <h2>비밀번호 변경</h2>
    <p id="forced" class="notice" hidden>임시 비밀번호로 로그인했습니다. 계속하려면 비밀번호를 바꿔 주세요.</p>
    <form id="form">
      <label for="current">현재 비밀번호</label>
      <input id="current" type="password" autocomplete="current-password" required>
      <label for="new">새 비밀번호 (10자 이상)</label>
      <input id="new" type="password" autocomplete="new-password" required>
      <label for="confirm">새 비밀번호 확인</label>
      <input id="confirm" type="password" autocomplete="new-password" required>
      <div class="actions"><button class="primary" type="submit">변경</button></div>
    </form>
    <div id="error" class="error"></div>
  </section>
</main>
<script src="/js/api.js"></script>
<script>
api("/auth/me").then(me => { document.getElementById("forced").hidden = !me.must_change_password; }).catch(goLogin);
document.getElementById("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const errorBox = document.getElementById("error");
  errorBox.textContent = "";
  const next = document.getElementById("new").value;
  if (next !== document.getElementById("confirm").value) { errorBox.textContent = "새 비밀번호가 일치하지 않습니다."; return; }
  try {
    await api("/users/me/password", { method: "PUT", body: {
      current_password: document.getElementById("current").value, new_password: next } });
    location.href = "/";
  } catch (e) {
    errorBox.textContent = e.message;
  }
};
</script>
</body>
</html>
