<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>토론</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <a href="/">← 목록</a>
  <h1 id="topic">토론</h1>
  <span id="status"></span>
</header>
<main class="layout">
  <section>
    <div id="transcript" class="transcript"></div>
    <p id="empty" class="muted">아직 발언이 없습니다.</p>
    <div id="error" class="error"></div>

    <section id="report" class="card report" hidden>
      <h2>종합보고서 <span id="report-status"></span></h2>
      <div id="report-body"></div>
      <div class="actions">
        <button id="report-generate">보고서 생성</button>
        <a id="report-md" class="button" hidden>Markdown 다운로드</a>
        <a id="report-json" class="button" hidden>JSON 다운로드</a>
      </div>
      <div id="report-error" class="error"></div>
    </section>
  </section>
  <aside>
    <div class="card">
      <h2>진행</h2>
      <div class="actions" style="margin-top:0">
        <button id="start" class="primary" hidden>시작</button>
        <button id="resume" class="primary" hidden>이어서 진행</button>
        <button id="stop" class="danger" hidden>중지</button>
        <button id="delete" hidden>삭제</button>
      </div>
      <p id="usage" class="muted"></p>
    </div>
    <div id="speak-card" class="card" hidden>
      <h2>발언</h2>
      <p id="floor-info" class="muted"></p>
      <ol id="hand-queue" class="subtopics"></ol>
      <div class="actions">
        <button id="raise" class="primary">발언 요청</button>
        <span id="my-position" class="muted"></span>
        <button id="cancel-hand" hidden>요청 취소</button>
        <button id="revoke" class="danger" hidden>발언권 회수</button>
      </div>
      <div id="speech-box" hidden>
        <p class="notice">발언할 차례입니다. 토론이 입력을 기다리고 있습니다.</p>
        <textarea id="speech" maxlength="1000" rows="5" placeholder="의견을 입력하세요 (최대 1000자)"></textarea>
        <div class="actions">
          <button id="submit-speech" class="primary">제출</button>
          <button id="give-up">포기</button>
        </div>
      </div>
      <div id="speak-error" class="error"></div>
    </div>
    <div id="stance-card" class="card" hidden>
      <h2>현재 입장 <span class="muted">(−1 반대 ~ +1 찬성)</span></h2>
      <div id="stances"></div>
      <p id="open-challenges" class="muted"></p>
    </div>
    <div class="card">
      <h2>소주제</h2>
      <ol id="subtopics" class="subtopics"></ol>
      <p id="no-subtopics" class="muted">없음</p>
    </div>
    <div class="card">
      <h2>참가자</h2>
      <div id="participants"></div>
    </div>
  </aside>
</main>

<script src="/js/api.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const TERMINAL = ["completed", "stopped", "failed", "interrupted"];
const ACTIVE = ["running", "awaiting_human", "reporting"];
const transcript = document.getElementById("transcript");
let lastSeq = 0;
let streaming = null;  // 현재 스트리밍 중인 발언 DOM
let source = null;
let currentSubtopic = null;
let reportPoll = null;
let me = null;
let canControl = false;  // 시작·중지·삭제·보고서 재생성: 생성자 또는 관리자
let hands = { queue: [], floor: null };
let currentStatus = null;
const RELEASE_REASONS = { cancelled: "포기", revoked: "생성자·관리자가 회수", stopped: "토론 중지" };

function renderHands(state) {
  if (state) hands = { queue: state.queue || [], floor: state.floor || null };
  const open = ["running", "awaiting_human"].includes(currentStatus);
  document.getElementById("speak-card").hidden = !open;
  if (!open || !me) return;
  const floor = hands.floor;
  const myFloor = floor && floor.user_id === me.id;
  const position = hands.queue.findIndex(h => h.user_id === me.id) + 1;

  document.getElementById("floor-info").textContent = floor
    ? `${floor.name}님의 발언 차례입니다 (입력 대기 중).`
    : hands.queue.length ? "진행 중인 발언이 끝나면 차례대로 발언권이 주어집니다." : "AI 발언 중에도 요청할 수 있습니다. 현재 발언이 끝나면 토론이 멈추고 입력을 기다립니다.";
  document.getElementById("hand-queue").replaceChildren(...hands.queue.map(h => el("li", {}, h.name)));
  document.getElementById("raise").hidden = myFloor || position > 0;
  document.getElementById("cancel-hand").hidden = position === 0;
  document.getElementById("my-position").textContent = position ? `대기 ${position}번째` : "";
  document.getElementById("revoke").hidden = !(canControl && floor && !myFloor);
  const box = document.getElementById("speech-box");
  const wasHidden = box.hidden;
  box.hidden = !myFloor;
  if (myFloor && wasHidden) {
    box.scrollIntoView({ behavior: "smooth", block: "center" });
    document.getElementById("speech").focus();
  }
}

async function speakAction(fn) {
  document.getElementById("speak-error").textContent = "";
  try { await fn(); } catch (e) { document.getElementById("speak-error").textContent = e.message; }
}

const LABELS = { agreed: "합의", partial: "부분 합의", disagreed: "이견", insufficient: "판단 보류" };
const STANCES = { agree: "찬성", partially_agree: "부분 찬성", disagree: "반대", no_position: "입장 없음" };
const DIRECTIONS = { support: "지지 쪽", oppose: "반대 쪽", split: "양분" };
const pct = v => v == null ? "-" : `${Math.round(v * 100)}%`;

function labelBadge(label) {
  return el("span", { class: `badge ${label || ""}` }, LABELS[label] || "-");
}

function scoreBox(name, value) {
  return el("div", { class: "score" },
    el("div", { class: "name" }, name),
    el("div", { class: "value" }, pct(value)),
    el("div", { class: "bar" }, el("span", { style: `width:${value == null ? 0 : Math.round(value * 100)}%` })));
}

function issueNode(issue) {
  return el("details", {},
    el("summary", {}, labelBadge(issue.label), " ", issue.title, " ",
      el("span", { class: "muted" }, `${pct(issue.scores.overall)} · ${DIRECTIONS[issue.direction] || "-"}`)),
    el("p", { class: "muted" }, issue.summary),
    el("ul", { class: "positions" }, ...issue.positions.map(p => el("li", {},
      el("strong", {}, p.participant), p.participant_type === "human" ? " (사람)" : "",
      ` · ${STANCES[p.stance]}: ${p.claim}`,
      p.unsourced_specifics ? el("span", { class: "badge failed", title: "출처를 확인할 수 없는 수치·사례에 기댄 주장" }, "출처 없음") : null,
      p.evidence_seqs.length ? el("span", { class: "muted" }, ` [#${p.evidence_seqs.join(", #")}]`) : null))));
}

function renderReport(r) {
  const section = document.getElementById("report");
  section.hidden = false;
  document.getElementById("report-status").replaceChildren(
    r ? el("span", { class: "badge" }, { pending: "생성 중", ready: "완료", failed: "실패" }[r.status] || r.status) : "");
  document.getElementById("report-error").textContent = r && r.status === "failed" ? r.error || "" : "";
  const body = document.getElementById("report-body");
  const ready = r && r.status === "ready";
  ["report-md", "report-json"].forEach(idName => document.getElementById(idName).hidden = !ready);
  if (!ready) {
    body.replaceChildren(el("p", { class: "muted" },
      !r ? "아직 보고서가 없습니다." : r.status === "pending" ? "보고서를 생성하고 있습니다..." : "보고서 생성에 실패했습니다."));
    return;
  }
  const c = r.content;
  const groups = [["합의된 내용", "agreed"], ["부분 합의된 내용", "partial"], ["합의되지 않은 내용", "disagreed"]];
  if (c.issues.some(i => i.label === "insufficient")) groups.push(["판단 보류 (입장을 밝힌 참가자 1명 이하)", "insufficient"]);
  body.replaceChildren(
    // 인간간은 사람 2명 이상, AI-인간간은 사람이 참여했을 때만 계산되므로 값이 있을 때만 표시
    el("div", { class: "scores" }, scoreBox("종합", c.scores.overall), scoreBox("AI간", c.scores.ai),
      ...[["인간간", c.scores.human], ["AI-인간간", c.scores.ai_human]]
        .filter(([, v]) => v != null).map(([name, v]) => scoreBox(name, v))),
    el("p", {}, labelBadge(c.label), " ", c.narrative.executive_summary),
    ...groups.flatMap(([title, key]) => {
      const issues = c.issues.filter(i => i.label === key);
      return [el("h3", {}, `${title} (${issues.length})`), ...(issues.length ? issues.map(issueNode) : [el("p", { class: "muted" }, "없음")])];
    }),
    ...dynamicsNodes(c.dynamics),
    el("h3", {}, "열린 질문"), el("ul", {}, ...c.narrative.open_questions.map(q => el("li", {}, q))),
    el("h3", {}, "제언"), el("ul", {}, ...c.narrative.recommendations.map(q => el("li", {}, q))),
    el("p", { class: "muted" }, `합의 정도 = 참가자 쌍의 평균 일치도 (찬성 1, 부분찬성 ${c.partial_weight ?? 0.7}, 반대 0, 일치도 = 1 − |차이|). 종합은 모든 쌍, AI간·인간간은 같은 집단 안, AI-인간간은 AI와 사람 사이 쌍. 합의 ≥ ${pct(c.thresholds.agreed)}, 부분 합의 ≥ ${pct(c.thresholds.partial)}. 입장 2개 미만 쟁점은 판단 보류.`),
  );
}

async function loadReport() {
  clearTimeout(reportPoll);
  try {
    const r = await api(`/discussions/${encodeURIComponent(id)}/report`);
    renderReport(r);
    if (r.status === "pending") reportPoll = setTimeout(loadReport, 3000);
  } catch (e) {
    renderReport(null);  // 404: 보고서 없음
  }
}

const ACTION_LABELS = {
  position: "입장 표명", agree_extend: "동조·확장", example: "사례 추가", rebut: "반박", undercut: "근거 반박",
  respond_challenge: "반박에 답변", mediate: "중재", third_option: "제3안", devils_advocate: "반대 검토",
  closing: "최종 입장", respond_to_human: "사람 발언에 응답", human: "사람 참가자",
  opening: "개회", transition: "명제 전환", closing_announce: "마무리 안내", mediation: "중재 질문",
  // 이전 버전 토론 기록
  present: "관점 제시", respond: "응답", build: "확장", challenge: "반론", synthesize: "종합",
  probing: "구체화 질문", question: "질문", forced: "질문",
};

// 입장 값(−1 반대 ~ +1 찬성) 표시
function stanceLabel(x) {
  return x >= 0.6 ? "강한 찬성" : x >= 0.2 ? "찬성" : x > -0.2 ? "유보" : x > -0.6 ? "반대" : "강한 반대";
}
const signed = x => (x >= 0 ? "+" : "") + x.toFixed(2);

function renderStances(d) {
  const card = document.getElementById("stance-card");
  const names = Object.keys(d.stances || {}).filter(n => d.stances[n] != null);
  card.hidden = !names.length;
  if (!names.length) return;
  const moved = Object.fromEntries((d.moves || []).map(m => [m.listener, m]));
  document.getElementById("stances").replaceChildren(...names.map(n => {
    const x = d.stances[n];
    return el("div", { class: "stance" },
      el("div", {}, el("strong", {}, n), " ", el("span", { class: "muted" }, `${stanceLabel(x)} ${signed(x)}`),
        moved[n] ? el("span", { class: "muted" }, ` (${moved[n].by}의 발언으로 ${signed(moved[n].delta)})`) : null),
      el("div", { class: "stance-bar" }, el("span", { style: `left:${Math.round((x + 1) * 50)}%` })));
  }));
  document.getElementById("open-challenges").textContent = (d.open_challenges || []).length
    ? "답변 대기: " + d.open_challenges.map(c => `${c.challenger} → ${c.target}`).join(", ") : "";
}

function dynamicsNodes(dyn) {
  if (!dyn || !(dyn.propositions || []).length) return [];
  return [el("h3", {}, "토론 과정의 입장 변화"), ...dyn.propositions.map(p => el("details", {},
    el("summary", {}, `명제 ${p.index + 1}: ${p.title || "-"} `,
      p.spread_start != null ? el("span", { class: "muted" }, `입장 간격 ${p.spread_start.toFixed(2)} → ${p.spread_end.toFixed(2)}`) : null),
    el("ul", { class: "positions" }, ...p.trajectories.map(t => el("li", {},
      el("strong", {}, t.name), t.kind === "human" ? " (사람, 관찰값)" : "",
      ` · ${stanceLabel(t.start)} ${signed(t.start)} → ${stanceLabel(t.end)} ${signed(t.end)}`,
      Math.abs(t.shift) >= 0.05 ? ` (${signed(t.shift)})` : " (변화 없음)"))),
    p.influences.length ? el("p", { class: "muted" }, "영향: " + p.influences.map(i => `${i.by} → ${i.listener} ${signed(i.shift)}`).join(", ")) : null,
    p.unresolved.length ? el("p", { class: "muted" }, "답하지 않은 반박·질문: " + p.unresolved.map(u => `${u.challenger} → ${u.target}`).join(", ")) : null))];
}

// 최소 마크다운 표시: **굵게**, # 제목, --- 구분선 (innerHTML 없이 DOM 노드로 만들어 XSS 안전)
function renderRich(text) {
  const frag = document.createDocumentFragment();
  for (const line of (text || "").split("\n")) {
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { frag.append(el("hr")); continue; }
    const heading = line.match(/^\s*#{1,6}\s+(.*)$/);
    const content = heading ? heading[1] : line;
    const block = el("div", { class: heading ? "md-h" : "md-line" });
    for (const part of content.split(/(\*\*[^*]+\*\*)/g)) {
      if (/^\*\*[^*]+\*\*$/.test(part)) block.append(el("strong", {}, part.slice(2, -2)));
      else if (part) block.append(document.createTextNode(part));
    }
    if (!content.trim()) block.append(el("br"));
    frag.append(block);
  }
  return frag;
}

function messageNode(m) {
  const type = m.speaker_type || "ai";
  const reply = m.meta && m.meta.in_reply_to_seq ? ` #${m.meta.in_reply_to_seq}` : "";
  const label = m.action ? (ACTION_LABELS[m.action] || m.action) + reply : "";
  const action = label ? el("span", { class: "meta" }, `${m.seq ? `#${m.seq} · ` : ""}${label}`) : null;
  const node = el("div", { class: `msg ${type}` },
    el("div", { class: "who" }, m.speaker, action),
    el("div", { class: "body" }, renderRich(m.content)));
  if (m.sources && m.sources.length) node.append(el("div", { class: "sources" }, "출처: " + m.sources.join(", ")));
  return node;
}

function appendMessage(m) {
  if (m.seq <= lastSeq) return;
  lastSeq = m.seq;
  clearStreaming();
  transcript.append(messageNode(m));
  document.getElementById("empty").hidden = true;
  // 다시 불러온 발언에는 분석 결과(입장)가 저장돼 있다 — 실시간 발언은 analysis 이벤트로 갱신
  if (m.meta && m.meta.stances) renderStances({ stances: m.meta.stances, moves: m.meta.moves,
    open_challenges: ((m.meta.debate || {}).state || {}).challenges || [] });
  if (m.speaker_type === "moderator" && m.action === "transition" && m.meta && m.meta.subtopic) {
    currentSubtopic = m.meta.subtopic;
    highlightSubtopic();
  }
  window.scrollTo(0, document.body.scrollHeight);
}

function startStreaming(u) {
  clearStreaming();
  streaming = messageNode({ speaker: u.speaker, speaker_type: u.speaker_type, action: u.action, content: u.text || "" });
  streaming.classList.add("streaming");
  transcript.append(streaming);
  document.getElementById("empty").hidden = true;
}

function clearStreaming() {
  if (streaming) streaming.remove();
  streaming = null;
}

function renderSubtopics(list) {
  const ol = document.getElementById("subtopics");
  ol.replaceChildren(...(list || []).map(s => el("li", {}, s)));
  document.getElementById("no-subtopics").hidden = !!(list && list.length);
  highlightSubtopic();
}

function highlightSubtopic() {
  document.querySelectorAll("#subtopics li").forEach(li =>
    li.classList.toggle("current", li.textContent === currentSubtopic));
}

function setStatus(status) {
  currentStatus = status;
  renderHands();
  document.getElementById("status").replaceChildren(statusBadge(status));
  document.getElementById("start").hidden = !canControl || status !== "draft";
  document.getElementById("resume").hidden = !canControl || status !== "interrupted";
  document.getElementById("stop").hidden = !canControl || !ACTIVE.includes(status);
  document.getElementById("delete").hidden = !canControl || ACTIVE.includes(status);
  if (TERMINAL.includes(status)) {
    clearStreaming();
    if (source) { source.close(); source = null; }
    loadDetail();  // 사용량 등 최종 값 갱신
    loadReport();
  }
  document.getElementById("report-generate").hidden = !canControl || !TERMINAL.includes(status);
}

function connect() {
  if (source) source.close();
  source = new EventSource(`${API}/discussions/${encodeURIComponent(id)}/events?since=${lastSeq}`);
  source.addEventListener("message", e => appendMessage(JSON.parse(e.data)));
  source.addEventListener("snapshot", e => {
    const s = JSON.parse(e.data);
    if (s.hands) hands = s.hands;
    setStatus(s.status);
    if (s.current_utterance) startStreaming(s.current_utterance);
  });
  source.addEventListener("hand_queue", e => renderHands(JSON.parse(e.data)));
  source.addEventListener("floor_released", e => {
    const d = JSON.parse(e.data);
    if (me && d.user_id === me.id) {
      document.getElementById("speak-error").textContent = `발언권이 종료되었습니다 (${RELEASE_REASONS[d.reason] || d.reason}).`;
    }
  });
  source.addEventListener("utterance_start", e => startStreaming(JSON.parse(e.data)));
  source.addEventListener("chunk", e => {
    const d = JSON.parse(e.data);
    if (!streaming) startStreaming({ speaker: d.speaker, speaker_type: "ai", text: "" });
    streaming.querySelector(".body").textContent += d.delta;
  });
  source.addEventListener("utterance_aborted", clearStreaming);
  // 인증 만료 등으로 연결이 영구 종료되면 토큰을 갱신(api가 401 시 refresh)한 뒤 이어서 재접속
  source.onerror = () => {
    if (source && source.readyState === EventSource.CLOSED) {
      source = null;
      api(`/discussions/${encodeURIComponent(id)}`).then(() => setTimeout(connect, 1000)).catch(() => {});
    }
  };
  source.addEventListener("subtopics", e => {
    const list = JSON.parse(e.data).subtopics;
    currentSubtopic = list[0];
    renderSubtopics(list);
  });
  source.addEventListener("analysis", e => renderStances(JSON.parse(e.data)));
  source.addEventListener("report_status", e => renderReport({ status: JSON.parse(e.data).status, error: JSON.parse(e.data).error }));
  source.addEventListener("report_ready", loadReport);
  source.addEventListener("status", e => {
    const s = JSON.parse(e.data);
    setStatus(s.status);
    if (s.error) document.getElementById("error").textContent = s.error;
  });
}

async function loadDetail() {
  const d = await api(`/discussions/${encodeURIComponent(id)}`);
  document.title = d.topic;
  canControl = !!me && (me.role === "admin" || d.created_by === me.id);
  document.getElementById("topic").textContent = d.topic;
  currentSubtopic = d.current_subtopic;
  renderSubtopics(d.subtopics);
  document.getElementById("participants").replaceChildren(...d.participants.map(p =>
    el("div", { style: "margin-bottom:8px" }, el("strong", {}, p.name), el("div", { class: "muted" }, `${p.role} · ${p.model}`))));
  document.getElementById("usage").textContent =
    `생성자 ${d.created_by_name || "-"} · LLM 호출 ${d.llm_calls}회 · 토큰 ${d.prompt_tokens + d.completion_tokens}`;
  if (d.error) document.getElementById("error").textContent = d.error;
  return d;
}

document.getElementById("start").onclick = async () => {
  try {
    await api(`/discussions/${encodeURIComponent(id)}/start`, { method: "POST" });
    setStatus("running");
    connect();
  } catch (e) { document.getElementById("error").textContent = e.message; }
};
document.getElementById("resume").onclick = async () => {
  try {
    await api(`/discussions/${encodeURIComponent(id)}/resume`, { method: "POST" });
    document.getElementById("error").textContent = "";
    setStatus("running");
    connect();
  } catch (e) { document.getElementById("error").textContent = e.message; }
};
document.getElementById("stop").onclick = async () => {
  try { await api(`/discussions/${encodeURIComponent(id)}/stop`, { method: "POST", body: {} }); }
  catch (e) { document.getElementById("error").textContent = e.message; }
};
document.getElementById("raise").onclick = () => speakAction(async () =>
  renderHands(await api(`/discussions/${encodeURIComponent(id)}/hand`, { method: "POST" })));
document.getElementById("cancel-hand").onclick = () => speakAction(() =>
  api(`/discussions/${encodeURIComponent(id)}/hand`, { method: "DELETE" }));
document.getElementById("give-up").onclick = () => speakAction(() =>
  api(`/discussions/${encodeURIComponent(id)}/hand`, { method: "DELETE" }));
document.getElementById("revoke").onclick = () => speakAction(() =>
  api(`/discussions/${encodeURIComponent(id)}/floor/revoke`, { method: "POST" }));
document.getElementById("submit-speech").onclick = () => speakAction(async () => {
  const content = document.getElementById("speech").value.trim();
  if (!content) throw new Error("발언 내용을 입력하세요.");
  await api(`/discussions/${encodeURIComponent(id)}/speech`, { method: "POST",
    body: { floor_id: hands.floor && hands.floor.floor_id, content } });
  document.getElementById("speech").value = "";
});

document.getElementById("report-generate").onclick = async () => {
  document.getElementById("report-error").textContent = "";
  try {
    await api(`/discussions/${encodeURIComponent(id)}/report`, { method: "POST" });
    renderReport({ status: "pending" });
    reportPoll = setTimeout(loadReport, 3000);
  } catch (e) { document.getElementById("report-error").textContent = e.message; }
};
document.getElementById("report-md").href = `${API}/discussions/${encodeURIComponent(id)}/report/export?format=md`;
document.getElementById("report-json").href = `${API}/discussions/${encodeURIComponent(id)}/report/export?format=json`;
document.getElementById("delete").onclick = async () => {
  if (!confirm("이 토론과 모든 발언을 삭제할까요?")) return;
  try {
    await api(`/discussions/${encodeURIComponent(id)}`, { method: "DELETE" });
    location.href = "/";
  } catch (e) { document.getElementById("error").textContent = e.message; }
};

requireLogin()
  .then(user => { me = user; return loadDetail(); })
  .then(d => { setStatus(d.status); connect(); })
  .catch(e => document.getElementById("error").textContent = e.message);
</script>
</body>
</html>
