<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>토론</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <a href="/">← 목록</a>
  <h1 id="topic">토론</h1>
  <span id="status"></span>
</header>
<main class="layout">
  <section>
    <div id="transcript" class="transcript"></div>
    <p id="empty" class="muted">아직 발언이 없습니다.</p>
    <div id="error" class="error"></div>

    <section id="report" class="card report" hidden>
      <h2>종합보고서 <span id="report-status"></span></h2>
      <div id="report-body"></div>
      <div class="actions">
        <button id="report-generate">보고서 생성</button>
        <a id="report-md" class="button" hidden>Markdown 다운로드</a>
        <a id="report-json" class="button" hidden>JSON 다운로드</a>
      </div>
      <div id="report-error" class="error"></div>
    </section>
  </section>
  <aside>
    <div class="card">
      <h2>진행</h2>
      <div class="actions" style="margin-top:0">
        <button id="start" class="primary" hidden>시작</button>
        <button id="stop" class="danger" hidden>중지</button>
        <button id="delete" hidden>삭제</button>
      </div>
      <p id="usage" class="muted"></p>
    </div>
    <div class="card">
      <h2>소주제</h2>
      <ol id="subtopics" class="subtopics"></ol>
      <p id="no-subtopics" class="muted">없음</p>
    </div>
    <div class="card">
      <h2>참가자</h2>
      <div id="participants"></div>
    </div>
  </aside>
</main>

<script src="/js/api.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const TERMINAL = ["completed", "stopped", "failed", "interrupted"];
const ACTIVE = ["running", "awaiting_human", "reporting"];
const transcript = document.getElementById("transcript");
let lastSeq = 0;
let streaming = null;  // 현재 스트리밍 중인 발언 DOM
let source = null;
let currentSubtopic = null;
let reportPoll = null;
let me = null;
let canControl = false;  // 시작·중지·삭제·보고서 재생성: 생성자 또는 관리자

const LABELS = { agreed: "합의", partial: "부분 합의", disagreed: "이견", insufficient: "판단 보류" };
const STANCES = { agree: "찬성", partially_agree: "부분 찬성", disagree: "반대", no_position: "입장 없음" };
const DIRECTIONS = { support: "지지 쪽", oppose: "반대 쪽", split: "양분" };
const pct = v => v == null ? "-" : `${Math.round(v * 100)}%`;

function labelBadge(label) {
  return el("span", { class: `badge ${label || ""}` }, LABELS[label] || "-");
}

function scoreBox(name, value) {
  return el("div", { class: "score" },
    el("div", { class: "name" }, name),
    el("div", { class: "value" }, pct(value)),
    el("div", { class: "bar" }, el("span", { style: `width:${value == null ? 0 : Math.round(value * 100)}%` })));
}

function issueNode(issue) {
  return el("details", {},
    el("summary", {}, labelBadge(issue.label), " ", issue.title, " ",
      el("span", { class: "muted" }, `${pct(issue.scores.overall)} · ${DIRECTIONS[issue.direction] || "-"}`)),
    el("p", { class: "muted" }, issue.summary),
    el("ul", { class: "positions" }, ...issue.positions.map(p => el("li", {},
      el("strong", {}, p.participant), p.participant_type === "human" ? " (사람)" : "",
      ` · ${STANCES[p.stance]}: ${p.claim}`,
      p.evidence_seqs.length ? el("span", { class: "muted" }, ` [#${p.evidence_seqs.join(", #")}]`) : null))));
}

function renderReport(r) {
  const section = document.getElementById("report");
  section.hidden = false;
  document.getElementById("report-status").replaceChildren(
    r ? el("span", { class: "badge" }, { pending: "생성 중", ready: "완료", failed: "실패" }[r.status] || r.status) : "");
  document.getElementById("report-error").textContent = r && r.status === "failed" ? r.error || "" : "";
  const body = document.getElementById("report-body");
  const ready = r && r.status === "ready";
  ["report-md", "report-json"].forEach(idName => document.getElementById(idName).hidden = !ready);
  if (!ready) {
    body.replaceChildren(el("p", { class: "muted" },
      !r ? "아직 보고서가 없습니다." : r.status === "pending" ? "보고서를 생성하고 있습니다..." : "보고서 생성에 실패했습니다."));
    return;
  }
  const c = r.content;
  const groups = [["합의된 내용", "agreed"], ["부분 합의된 내용", "partial"], ["합의되지 않은 내용", "disagreed"]];
  if (c.issues.some(i => i.label === "insufficient")) groups.push(["판단 보류 (입장을 밝힌 참가자 1명 이하)", "insufficient"]);
  body.replaceChildren(
    el("div", { class: "scores" }, scoreBox("종합", c.scores.overall), scoreBox("AI 참가자", c.scores.ai), scoreBox("사람 참가자", c.scores.human)),
    el("p", {}, labelBadge(c.label), " ", c.narrative.executive_summary),
    ...groups.flatMap(([title, key]) => {
      const issues = c.issues.filter(i => i.label === key);
      return [el("h3", {}, `${title} (${issues.length})`), ...(issues.length ? issues.map(issueNode) : [el("p", { class: "muted" }, "없음")])];
    }),
    el("h3", {}, "열린 질문"), el("ul", {}, ...c.narrative.open_questions.map(q => el("li", {}, q))),
    el("h3", {}, "제언"), el("ul", {}, ...c.narrative.recommendations.map(q => el("li", {}, q))),
    el("p", { class: "muted" }, `합의 정도 = 쟁점별 수렴도의 가중 평균. 수렴도 = max(지지, 반대), 지지 = (찬성 + ${c.partial_weight ?? 0.7}×부분찬성)/입장 수. 합의 ≥ ${pct(c.thresholds.agreed)}, 부분 합의 ≥ ${pct(c.thresholds.partial)}. 입장 2개 미만 쟁점은 판단 보류.`),
  );
}

async function loadReport() {
  clearTimeout(reportPoll);
  try {
    const r = await api(`/discussions/${encodeURIComponent(id)}/report`);
    renderReport(r);
    if (r.status === "pending") reportPoll = setTimeout(loadReport, 3000);
  } catch (e) {
    renderReport(null);  // 404: 보고서 없음
  }
}

function messageNode(m) {
  const type = m.speaker_type || "ai";
  const action = m.action ? el("span", { class: "meta" }, m.action) : null;
  const node = el("div", { class: `msg ${type}` },
    el("div", { class: "who" }, m.speaker, action),
    el("div", { class: "body" }, m.content || ""));
  if (m.sources && m.sources.length) node.append(el("div", { class: "sources" }, "출처: " + m.sources.join(", ")));
  return node;
}

function appendMessage(m) {
  if (m.seq <= lastSeq) return;
  lastSeq = m.seq;
  clearStreaming();
  transcript.append(messageNode(m));
  document.getElementById("empty").hidden = true;
  if (m.speaker_type === "moderator" && m.action === "transition" && m.meta && m.meta.subtopic) {
    currentSubtopic = m.meta.subtopic;
    highlightSubtopic();
  }
  window.scrollTo(0, document.body.scrollHeight);
}

function startStreaming(u) {
  clearStreaming();
  streaming = messageNode({ speaker: u.speaker, speaker_type: u.speaker_type, action: u.action, content: u.text || "" });
  streaming.classList.add("streaming");
  transcript.append(streaming);
  document.getElementById("empty").hidden = true;
}

function clearStreaming() {
  if (streaming) streaming.remove();
  streaming = null;
}

function renderSubtopics(list) {
  const ol = document.getElementById("subtopics");
  ol.replaceChildren(...(list || []).map(s => el("li", {}, s)));
  document.getElementById("no-subtopics").hidden = !!(list && list.length);
  highlightSubtopic();
}

function highlightSubtopic() {
  document.querySelectorAll("#subtopics li").forEach(li =>
    li.classList.toggle("current", li.textContent === currentSubtopic));
}

function setStatus(status) {
  document.getElementById("status").replaceChildren(statusBadge(status));
  document.getElementById("start").hidden = !canControl || status !== "draft";
  document.getElementById("stop").hidden = !canControl || !ACTIVE.includes(status);
  document.getElementById("delete").hidden = !canControl || ACTIVE.includes(status);
  if (TERMINAL.includes(status)) {
    clearStreaming();
    if (source) { source.close(); source = null; }
    loadDetail();  // 사용량 등 최종 값 갱신
    loadReport();
  }
  document.getElementById("report-generate").hidden = !canControl || !TERMINAL.includes(status);
}

function connect() {
  if (source) source.close();
  source = new EventSource(`${API}/discussions/${encodeURIComponent(id)}/events?since=${lastSeq}`);
  source.addEventListener("message", e => appendMessage(JSON.parse(e.data)));
  source.addEventListener("snapshot", e => {
    const s = JSON.parse(e.data);
    setStatus(s.status);
    if (s.current_utterance) startStreaming(s.current_utterance);
  });
  source.addEventListener("utterance_start", e => startStreaming(JSON.parse(e.data)));
  source.addEventListener("chunk", e => {
    const d = JSON.parse(e.data);
    if (!streaming) startStreaming({ speaker: d.speaker, speaker_type: "ai", text: "" });
    streaming.querySelector(".body").textContent += d.delta;
  });
  source.addEventListener("utterance_aborted", clearStreaming);
  // 인증 만료 등으로 연결이 영구 종료되면 토큰을 갱신(api가 401 시 refresh)한 뒤 이어서 재접속
  source.onerror = () => {
    if (source && source.readyState === EventSource.CLOSED) {
      source = null;
      api(`/discussions/${encodeURIComponent(id)}`).then(() => setTimeout(connect, 1000)).catch(() => {});
    }
  };
  source.addEventListener("subtopics", e => {
    const list = JSON.parse(e.data).subtopics;
    currentSubtopic = list[0];
    renderSubtopics(list);
  });
  source.addEventListener("report_status", e => renderReport({ status: JSON.parse(e.data).status, error: JSON.parse(e.data).error }));
  source.addEventListener("report_ready", loadReport);
  source.addEventListener("status", e => {
    const s = JSON.parse(e.data);
    setStatus(s.status);
    if (s.error) document.getElementById("error").textContent = s.error;
  });
}

async function loadDetail() {
  const d = await api(`/discussions/${encodeURIComponent(id)}`);
  document.title = d.topic;
  canControl = !!me && (me.role === "admin" || d.created_by === me.id);
  document.getElementById("topic").textContent = d.topic;
  currentSubtopic = d.current_subtopic;
  renderSubtopics(d.subtopics);
  document.getElementById("participants").replaceChildren(...d.participants.map(p =>
    el("div", { style: "margin-bottom:8px" }, el("strong", {}, p.name), el("div", { class: "muted" }, `${p.role} · ${p.model}`))));
  document.getElementById("usage").textContent =
    `생성자 ${d.created_by_name || "-"} · LLM 호출 ${d.llm_calls}회 · 토큰 ${d.prompt_tokens + d.completion_tokens}`;
  if (d.error) document.getElementById("error").textContent = d.error;
  return d;
}

document.getElementById("start").onclick = async () => {
  try {
    await api(`/discussions/${encodeURIComponent(id)}/start`, { method: "POST" });
    setStatus("running");
    connect();
  } catch (e) { document.getElementById("error").textContent = e.message; }
};
document.getElementById("stop").onclick = async () => {
  try { await api(`/discussions/${encodeURIComponent(id)}/stop`, { method: "POST", body: {} }); }
  catch (e) { document.getElementById("error").textContent = e.message; }
};
document.getElementById("report-generate").onclick = async () => {
  document.getElementById("report-error").textContent = "";
  try {
    await api(`/discussions/${encodeURIComponent(id)}/report`, { method: "POST" });
    renderReport({ status: "pending" });
    reportPoll = setTimeout(loadReport, 3000);
  } catch (e) { document.getElementById("report-error").textContent = e.message; }
};
document.getElementById("report-md").href = `${API}/discussions/${encodeURIComponent(id)}/report/export?format=md`;
document.getElementById("report-json").href = `${API}/discussions/${encodeURIComponent(id)}/report/export?format=json`;
document.getElementById("delete").onclick = async () => {
  if (!confirm("이 토론과 모든 발언을 삭제할까요?")) return;
  try {
    await api(`/discussions/${encodeURIComponent(id)}`, { method: "DELETE" });
    location.href = "/";
  } catch (e) { document.getElementById("error").textContent = e.message; }
};

requireLogin()
  .then(user => { me = user; return loadDetail(); })
  .then(d => { setStatus(d.status); connect(); })
  .catch(e => document.getElementById("error").textContent = e.message);
</script>
</body>
</html>
